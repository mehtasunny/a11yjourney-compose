name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit and Compose semantics tests, lint, demo build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue :library:testDebugUnitTest :library:lintDebug :demo:assembleDebug :demo:lintDebug 2>&1 | tee gradle.log
      - name: Annotate results
        if: always()
        run: python3 scripts/ci_annotate.py build gradle.log
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            library/build/reports/
            demo/build/reports/
          if-no-files-found: ignore
      - name: Upload demo APK
        uses: actions/upload-artifact@v7
        with:
          name: demo-apk
          path: demo/build/outputs/apk/debug/demo-debug.apk

  audit-demo:
    name: Audit the demo app with A11yJourney on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: demo-apk
          path: apk
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install A11yJourney
        run: pip install git+https://github.com/mehtasunny/a11yjourney
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the audit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/audit-demo.sh apk/demo-debug.apk
      - name: Annotate audit results
        if: always()
        run: python3 scripts/ci_annotate.py audit reports
      - name: Upload captures and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11yjourney-audit
          path: |
            captures/
            reports/
          if-no-files-found: ignore
