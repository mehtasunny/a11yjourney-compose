[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
media3 = "1.11.1"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
